name: Keep Render warm

# Backup wake-up only. The server pings itself every 10 minutes (server/index.js),
# which is what actually keeps Render's free instance awake; GitHub throttles this
# schedule to every few hours on a quiet repo. If the server ever does sleep (e.g.
# after a deploy with no visitors), this brings it back.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the server
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 60 https://exploding-cats.onrender.com/api/ping; then
              echo; exit 0
            fi
            echo "attempt $i failed; retrying"; sleep 20
          done
          exit 1
