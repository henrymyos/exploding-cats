# Render Blueprint — one-click deploy for Exploding Cats.
# In Render: New + > Blueprint > pick the exploding-cats repo > Apply.
services:
  - type: web
    name: exploding-cats
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
