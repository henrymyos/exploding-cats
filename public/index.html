<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Exploding Cats — Family Edition</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- iPhone "Add to Home Screen" icon + standalone app -->
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#1a1430" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Exploding Cats" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
</head>
<body>
  <div id="app">

    <!-- ============ HOME / LOBBY JOIN ============ -->
    <section id="home" class="screen active">
      <div class="home-card">
        <h1>🐱 Exploding Cats</h1>
        <p class="tagline">Family Edition</p>

        <label class="field">
          <span>Your name</span>
          <input id="nameInput" type="text" maxlength="16" placeholder="e.g. Mom" autocomplete="off" />
        </label>

        <div class="field">
          <span>Pick your cat</span>
          <div id="avatarPicker" class="avatar-picker"></div>
        </div>
      </div>

      <div class="home-card">
        <button id="createBtn" class="btn primary">Create a game</button>

        <div class="divider"><span>or join one</span></div>

        <label class="field">
          <span>Room code</span>
          <input id="codeInput" type="text" maxlength="4" placeholder="ABCD" autocomplete="off" />
        </label>
        <button id="joinBtn" class="btn">Join game</button>

        <p id="homeError" class="error"></p>
      </div>
    </section>

    <!-- ============ LOBBY ============ -->
    <section id="lobby" class="screen">
      <div class="home-card">
        <h2>Room <span id="lobbyCode" class="code"></span></h2>
        <p class="hint">Share this code with your family so they can join from their own device.</p>
        <div id="modeSelect" class="mode-select">
          <button class="mode-opt" data-mode="original"><b>Original</b><small>2–5 players · 56 cards</small></button>
          <button class="mode-opt" data-mode="party"><b>Party Pack</b><small>up to 10 · new cards</small></button>
        </div>
        <p id="modeHint" class="hint mode-hint"></p>
        <div id="expansionSelect" class="expansion-select">
          <span class="exp-title">Expansions <small>mix &amp; match</small></span>
          <button class="exp-opt" data-exp="imploding">
            <span class="exp-icon">☢️</span>
            <span class="exp-info"><b>Imploding Kittens</b><small>Un-defusable kitten + Reverse</small></span>
            <span class="exp-switch"></span>
          </button>
          <button class="exp-opt" data-exp="streaking">
            <span class="exp-icon">😼</span>
            <span class="exp-info"><b>Streaking Kittens</b><small>Hold a kitten · Mark &amp; Swap</small></span>
            <span class="exp-switch"></span>
          </button>
          <button class="exp-opt" data-exp="zombie">
            <span class="exp-icon">🧟</span>
            <span class="exp-info"><b>Zombie mode</b><small>Death isn't the end</small></span>
            <span class="exp-switch"></span>
          </button>
        </div>
        <ul id="lobbyPlayers" class="player-list"></ul>
        <div id="botControls" class="bot-controls">
          <button id="addBotBtn" class="btn">🤖 Add a bot</button>
          <button id="removeBotBtn" class="btn">Remove bot</button>
        </div>
        <button id="startBtn" class="btn primary">Start game</button>
        <p id="lobbyHint" class="hint"></p>
        <button id="leaveLobbyBtn" class="btn ghost">Leave lobby</button>
        <div id="lobbyScores" class="scoreboard"></div>
      </div>
    </section>

    <!-- ============ GAME TABLE ============ -->
    <section id="game" class="screen">
      <header class="table-top">
        <div id="opponents" class="opponents"></div>
      </header>

      <main class="table-center">
        <div id="oddsBar" class="odds-bar hidden" title="Chance the next card is an Exploding Kitten">
          <div class="odds-track"><div id="oddsFill" class="odds-fill"></div></div>
          <div id="oddsText" class="odds-text"></div>
        </div>
        <div class="piles">
          <button id="drawPile" class="pile draw" title="Draw a card">
            <div class="pile-back"><span id="deckCount" class="deck-count">0</span></div>
            <span class="pile-label"><span id="deckLeft">0</span> cards left</span>
          </button>
          <div class="pile discard">
            <div id="discardTop" class="card-mini empty"></div>
            <span class="pile-label">Discard</span>
          </div>
        </div>
      </main>

      <footer class="hand-area">
        <div id="turnBanner" class="turn-banner"></div>
        <div id="pendingArea" class="pending-area"></div>
        <div id="liveKittenWarn" class="live-kitten-warn hidden">⚠️ You're holding a live Exploding Kitten — keep your Streaking Kitten!</div>
        <div id="handActions" class="hand-actions"></div>
        <div id="hand" class="hand"></div>
      </footer>

      <aside id="drawReveal" class="draw-reveal hidden"></aside>

      <!-- quick reactions -->
      <div id="reactBar" class="react-bar"></div>

      <button id="menuToggle" class="menu-toggle" title="Game menu">☰</button>
      <button id="logToggle" class="log-toggle" title="Game log">📜</button>
      <aside id="logPanel" class="log-panel">
        <button id="logClose" class="log-close" aria-label="Close log">✕</button>
        <h3>Game log</h3>
        <ul id="logList"></ul>
      </aside>
    </section>

    <!-- ============ OVERLAYS / MODALS ============ -->
    <div id="overlay" class="overlay hidden">
      <div id="overlayBox" class="overlay-box"></div>
    </div>

    <!-- Nope prompt -->
    <div id="hissBar" class="hiss-bar hidden">
      <button id="hissDismiss" class="hiss-x" title="Don't Nope — let it happen">✕</button>
      <span id="hissText"></span>
      <button id="hissBtn" class="btn danger">Nope</button>
    </div>

    <!-- toast -->
    <div id="toast" class="toast hidden"></div>

    <!-- card description tooltip (hover on desktop / press-and-hold on mobile) -->
    <div id="cardTip" class="card-tip hidden"></div>

    <!-- victory celebration -->
    <div id="victory" class="victory hidden"></div>

    <!-- card-taken popup (shown to the taker and the loser) -->
    <div id="transfer" class="transfer-pop hidden"></div>
  </div>

  <!-- explosion flash (outside #app so it doesn't shake) -->
  <div id="boom" class="boom"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
